<p-button icon="ri-settings-3-line"
          severity="primary"
          [outlined]="true"
          [label]="'graph_navigator.settings.button' | transloco"
          data-test="graph-navigator-settings-btn"
          (onClick)="popover.toggle($event)"/>

<p-popover #popover [dismissable]="dismissable()" styleClass="graph-navigator-settings-popover">
  <ng-template #content>
    <div class="graph-navigator-settings" data-test="graph-navigator-settings-popover">
      <header class="settings-header">
        <h4>{{ 'graph_navigator.settings.upload.title' | transloco }}</h4>
        @if (settings().isUploaded()) {
          <p-button [link]="true"
                    [label]="'graph_navigator.settings.reset' | transloco"
                    [disabled]="loading()"
                    data-test="graph-navigator-settings-reset-btn"
                    (onClick)="confirmReset()"/>
        }
      </header>

      <p-fileupload #fileUpload
                    mode="advanced"
                    accept=".ttl"
                    [multiple]="false"
                    [customUpload]="true"
                    [disabled]="loading()"
                    styleClass="graph-navigator-settings-upload"
                    [chooseLabel]="'graph_navigator.settings.upload.browse' | transloco"
                    chooseIcon="ri-file-search-line"
                    uploadIcon="ri-upload-2-line"
                    cancelIcon="ri-close-line"
                    data-test="graph-navigator-settings-upload"
                    (uploadHandler)="confirmUpload($event)">
        <ng-template #file let-file>
          <div class="p-fileupload-file" data-test="graph-navigator-settings-upload-file">
            <div class="p-fileupload-file-info">
              <div class="p-fileupload-file-name">{{ file.name }}</div>
              <data class="p-fileupload-file-size" [value]="file.size">{{ fileUpload.formatSize(file.size) }}</data>
            </div>
            <p-badge class="p-fileupload-file-badge" [value]="'graph_navigator.settings.upload.pending' | transloco"/>
          </div>
        </ng-template>
        <ng-template #empty>
          <p class="upload-drop-hint">{{ 'graph_navigator.settings.upload.drop_hint' | transloco }}</p>
        </ng-template>
      </p-fileupload>

      <p-button [link]="true"
                icon="ri-download-2-line"
                [label]="'graph_navigator.settings.export' | transloco"
                data-test="graph-navigator-settings-export-btn"
                (onClick)="exportSettings.emit()"/>
    </div>
  </ng-template>
</p-popover>
