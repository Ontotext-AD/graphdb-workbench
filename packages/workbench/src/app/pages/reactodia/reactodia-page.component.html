<app-page-layout class="sparql-editor-page">
  @let repository = currentRepository();
  @let graphNavigatorSettings = settings();
  @if (repository && graphNavigatorSettings) {
    <app-reactodia-settings class="reactodia-settings-toolbar"
                            *appRestrictAccess="[ViewPermissions.CAN_MAINTAIN_ACTIVE_REPO]"
                            [settings]="graphNavigatorSettings"
                            [loading]="loading()"
                            (uploadSettings)="onUploadSettings($event, repository)"
                            (resetSettings)="onResetSettings(repository)"
                            (exportSettings)="onExportSettings(repository)">
    </app-reactodia-settings>
    <div>
      @if (language() && !loading()) {
        <app-reactodia-component-facade
          [currentRepository]="repository"
          [language]="language()"
          [theme]="theme()"
          [seedIris]="seedIris()"
          [seedGraph]="seedGraph()"
          [providerSettings]="graphNavigatorSettings.getProviderSettings()">
        </app-reactodia-component-facade>
      }
    </div>
  }
</app-page-layout>
