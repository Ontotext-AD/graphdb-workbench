<div class="page-restrictions" [style.height.px]="availableHeight()">
  @for (reason of restrictions(); track reason.translationKey) {
    <p-message [severity]="reason.severity" icon="ri-alert-line">

      <div>
        <span [innerHTML]="reason.translationKey | transloco: reason.translationParams"></span>
        @if (reason.actionLabelKey && reason.actionLink) {
          @if (reason.isExternalAction) {
            <a [href]="reason.actionLink" target="_blank" rel="noopener noreferrer">{{ reason.actionLabelKey | transloco }}</a>
          } @else {
            <a [routerLink]="reason.actionLink">{{ reason.actionLabelKey | transloco }}</a>
          }
        }
      </div>
    </p-message>
  }
  @if (repositoryList() && !selectedRepository()) {
    <app-repository-picker-list
      class="repository-list"
      [requireWriteAccess]="requiresWriteAccess()"
      [filterByTypes]="allowedRepositoryTypes()"
      [filterByPermission]="requiredRepositoryPermission()"
      [showStateFilter]="false">
    </app-repository-picker-list>
  }
</div>
